spring.application.name=keepers-api

# Base de datos independiente para Keepers
spring.datasource.url=jdbc:mysql://localhost:3306/keepers_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto diferente para evitar conflictos con Animals API
server.port=8081
